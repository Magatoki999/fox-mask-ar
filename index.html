<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>幻狐録 ARシミュレーター</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050505; 
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            color: white; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            touch-action: none; 
        }
        #ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 30px 20px; 
            box-sizing: border-box; 
        }
        .header { 
            text-align: center; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
        }
        .header h1 { 
            margin: 0; 
            font-size: 1.2rem; 
            letter-spacing: 3px; 
            color: #fff;
        }
        .header p { 
            margin: 5px 0 0; 
            font-size: 0.8rem; 
            color: #00ffff; 
            letter-spacing: 1px;
        }
        .controls { 
            text-align: center; 
            padding-bottom: 20px; 
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn { 
            pointer-events: auto; 
            padding: 10px 20px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            letter-spacing: 2px; 
            backdrop-filter: blur(5px);
        }
        .btn-normal {
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); 
        }
        .btn-cyber {
            background: rgba(0, 255, 255, 0.1); 
            border: 1px solid #00ffff; 
            color: #00ffff; 
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); 
        }
        .btn-kabuki {
            background: rgba(30, 0, 0, 0.6); 
            border: 1px solid #ff3333; 
            color: #ff3333; 
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.2); 
        }
        .btn-custom {
            background: rgba(138, 43, 226, 0.2); 
            border: 1px solid #9932cc; 
            color: #e0b0ff; 
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3); 
        }
        .btn:active { 
            transform: scale(0.95);
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        /* NFT用のオーバーレイUI */
        #nft-overlay {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 10, 30, 0.8);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nft-icon {
            font-size: 1.4rem;
        }
    </style>
    <!-- Three.js (軽量な3Dライブラリ) を読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader (GLBモデル読み込み用) を追加 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="status">DRAG TO ROTATE</div>
    
    <div id="nft-overlay">
        <span class="nft-icon">💎</span>
        <span>1 of 1 Unique Design<br><small style="color:#aaa;">NFT Minting Ready...</small></span>
    </div>

    <div id="ui-layer">
        <div class="header">
            <h1>GENKOROKU AR</h1>
            <p>Loading Model...</p>
        </div>
        <div class="controls">
            <button class="btn btn-normal" id="normalBtn">ノーマル</button>
            <button class="btn btn-cyber" id="cyberBtn">サイバー</button>
            <button class="btn btn-kabuki" id="kabukiBtn">歌舞伎</button>
            <button class="btn btn-custom" id="customBtn">カスタム/NFT</button>
        </div>
    </div>

    <script>
        // --- 1. 基本設定 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. 照明 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const effectLight = new THREE.PointLight(0x00ffff, 0, 10);
        effectLight.position.set(0, 0, 2);
        scene.add(effectLight);

        // --- 3. 狐面モデル(GLB)の読み込み ---
        const maskGroup = new THREE.Group();
        scene.add(maskGroup);

        // --- ★さらに本格化した歌舞伎風テクスチャの自動生成 ---
        function createKabukiTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 1024, 1024);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 左右対称に描画するためのヘルパー関数
            function drawSymmetricPath(pathFunc, lineWidth, color, blur = 20) {
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = blur;
                
                // 左側を描画
                ctx.save();
                ctx.beginPath();
                pathFunc(ctx);
                ctx.stroke();
                ctx.restore();

                // 右側（X軸を反転）を描画
                ctx.save();
                ctx.translate(1024, 0);
                ctx.scale(-1, 1);
                ctx.beginPath();
                pathFunc(ctx);
                ctx.stroke();
                ctx.restore();
            }

            // 1. 力強い黒の下地ライン（目の縁取りや隈のベース）
            drawSymmetricPath((ctx) => {
                // 目の縁から斜め上へ
                ctx.moveTo(440, 450);
                ctx.bezierCurveTo(350, 380, 250, 300, 100, 200);
                // 目の下から斜め下へ
                ctx.moveTo(440, 520);
                ctx.quadraticCurveTo(300, 600, 80, 650);
                // 口角から横へ
                ctx.moveTo(460, 750);
                ctx.quadraticCurveTo(350, 800, 150, 850);
            }, 40, '#111111');

            // 2. 赤い隈取（メインの筋隈 - より複雑に）
            
            // 眉間(額)から左右に割れる角のようなライン
            drawSymmetricPath((ctx) => {
                ctx.moveTo(512, 200);
                ctx.quadraticCurveTo(450, 150, 350, 100);
            }, 30, '#e60000', 25);
            
            // 額中央から鼻筋へ
            drawSymmetricPath((ctx) => {
                ctx.moveTo(512, 150);
                ctx.quadraticCurveTo(480, 350, 512, 550);
            }, 35, '#e60000', 25);

            // 目頭から額へ上るライン
            drawSymmetricPath((ctx) => {
                ctx.moveTo(480, 400);
                ctx.quadraticCurveTo(450, 300, 350, 200);
            }, 25, '#e60000', 20);

            // 目の上からこめかみへの鋭い跳ね
            drawSymmetricPath((ctx) => {
                ctx.moveTo(440, 440);
                ctx.bezierCurveTo(350, 400, 250, 320, 80, 250);
            }, 35, '#e60000', 25);
            
            // 目の下から外側への跳ね
            drawSymmetricPath((ctx) => {
                ctx.moveTo(440, 500);
                ctx.bezierCurveTo(320, 550, 200, 550, 50, 450);
            }, 25, '#e60000', 20);

            // 頬の太いカーブ（狐の頬の張りに合わせる）
            drawSymmetricPath((ctx) => {
                ctx.moveTo(460, 600);
                ctx.bezierCurveTo(350, 680, 200, 700, 50, 750);
            }, 40, '#e60000', 25);

            // 顎付近のライン
            drawSymmetricPath((ctx) => {
                ctx.moveTo(480, 800);
                ctx.quadraticCurveTo(380, 900, 250, 1000);
            }, 30, '#e60000', 25);


            // 3. アクセントの金の極細ライン（エッジを際立たせる）
            drawSymmetricPath((ctx) => {
                ctx.moveTo(440, 440);
                ctx.bezierCurveTo(350, 400, 250, 320, 80, 250);
            }, 6, '#ffd700', 10);

            drawSymmetricPath((ctx) => {
                ctx.moveTo(460, 600);
                ctx.bezierCurveTo(350, 680, 200, 700, 50, 750);
            }, 6, '#ffd700', 10);
            
            drawSymmetricPath((ctx) => {
                ctx.moveTo(512, 150);
                ctx.quadraticCurveTo(480, 350, 512, 550);
            }, 6, '#ffd700', 10);

            const texture = new THREE.CanvasTexture(canvas);
            // 新しいGLBのUVに合わせてリピート設定
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- カスタム/NFT用 ジェネレーティブテクスチャ ---
        function createCustomTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#050010';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.globalCompositeOperation = 'lighter';
            for(let i=0; i<40; i++) {
                ctx.beginPath();
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 150 + 20;
                ctx.arc(x, y, r, 0, Math.PI*2);
                const hue = Math.floor(Math.random() * 80) + 260;
                ctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.15)`;
                ctx.fill();
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            
            for(let i=0; i<30; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random()*1024, Math.random()*1024);
                ctx.lineTo(Math.random()*1024, Math.random()*1024);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const kabukiTexture = createKabukiTexture();
        const customTexture = createCustomTexture();

        // --- 4. ARエフェクト用マテリアル ---
        const cyberMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, wireframe: true, transparent: true, opacity: 0, 
            blending: THREE.AdditiveBlending, depthWrite: false
        });

        const kabukiMat = new THREE.MeshBasicMaterial({
            color: 0xffffff, map: kabukiTexture, transparent: true, opacity: 0,
            blending: THREE.NormalBlending, depthWrite: false
        });

        const customMat = new THREE.MeshBasicMaterial({
            color: 0xffffff, map: customTexture, transparent: true, opacity: 0,
            blending: THREE.AdditiveBlending, depthWrite: false
        });

        const loader = new THREE.GLTFLoader();
        
        document.querySelector('.header p').style.color = "#ffff00";

        // 同じ階層にある 'white_fox_mask.glb' を直接指定して読み込む
        loader.load('./white_fox_mask.glb', function(gltf) {
            const model = gltf.scene;

            // モデルのサイズと位置を自動調整
            const initialBox = new THREE.Box3().setFromObject(model);
            const size = initialBox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 4.0 / maxDim;
            model.scale.set(scale, scale, scale);

            const scaledBox = new THREE.Box3().setFromObject(model);
            const center = scaledBox.getCenter(new THREE.Vector3());
            model.position.sub(center);

            // UV展開済みのマテリアル設定を維持しつつ調整
            model.traverse((child) => {
                if (child.isMesh) {
                    if(child.material) {
                        child.material.roughness = 0.7;
                        child.material.metalness = 0.2;
                    }
                }
            });
            maskGroup.add(model);

            // --- エフェクト用モデルの生成 ---
            const cyberModel = model.clone();
            cyberModel.traverse((child) => { if (child.isMesh) child.material = cyberMat; });
            cyberModel.scale.multiplyScalar(1.01);
            maskGroup.add(cyberModel);

            const kabukiModel = model.clone();
            kabukiModel.traverse((child) => { if (child.isMesh) child.material = kabukiMat; });
            kabukiModel.scale.multiplyScalar(1.015);
            maskGroup.add(kabukiModel);

            const customModel = model.clone();
            customModel.traverse((child) => { if (child.isMesh) child.material = customMat; });
            customModel.scale.multiplyScalar(1.015);
            maskGroup.add(customModel);

            document.querySelector('.header p').innerText = "Scan Complete. Ready.";
            document.querySelector('.header p').style.color = "#00ff00";

            updateUI();

        }, undefined, function(error) {
            console.error('An error happened', error);
            document.querySelector('.header p').innerText = "Error loading 3D model.";
            document.querySelector('.header p').style.color = "red";
        });

        // --- 5. パーティクル（光の粒子） ---
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 200;
        const posArray = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.05, color: 0x00ffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending
        });
        const particleMesh = new THREE.Points(particleGeo, particleMat);
        scene.add(particleMesh);

        // --- 6. インタラクション（マウス/タッチで回す） ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        document.addEventListener('pointerdown', (e) => {
            if(e.target.classList.contains('btn')) return;
            isDragging = true;
            document.getElementById('status').style.opacity = 0;
        });
        document.addEventListener('pointerup', () => isDragging = false);
        document.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };
                maskGroup.rotation.y += deltaMove.x * 0.01;
                maskGroup.rotation.x += deltaMove.y * 0.01;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        // --- 7. エフェクト起動ロジック ---
        let currentMode = 'none';
        const normalBtn = document.getElementById('normalBtn');
        const cyberBtn = document.getElementById('cyberBtn');
        const kabukiBtn = document.getElementById('kabukiBtn');
        const customBtn = document.getElementById('customBtn');
        const nftOverlay = document.getElementById('nft-overlay');

        function updateUI() {
            normalBtn.style.background = currentMode === 'none' ? "rgba(255, 255, 255, 0.4)" : "rgba(255, 255, 255, 0.1)";
            normalBtn.style.boxShadow = currentMode === 'none' ? "0 0 20px rgba(255, 255, 255, 0.6)" : "0 0 10px rgba(255, 255, 255, 0.2)";

            cyberBtn.style.background = currentMode === 'cyber' ? "rgba(0, 255, 255, 0.4)" : "rgba(0, 255, 255, 0.1)";
            cyberBtn.style.boxShadow = currentMode === 'cyber' ? "0 0 20px rgba(0, 255, 255, 0.6)" : "0 0 10px rgba(0, 255, 255, 0.2)";
            
            kabukiBtn.style.background = currentMode === 'kabuki' ? "rgba(200, 0, 0, 0.6)" : "rgba(30, 0, 0, 0.6)";
            kabukiBtn.style.boxShadow = currentMode === 'kabuki' ? "0 0 20px rgba(255, 0, 0, 0.8)" : "0 0 10px rgba(255, 50, 50, 0.2)";

            customBtn.style.background = currentMode === 'custom' ? "rgba(138, 43, 226, 0.6)" : "rgba(138, 43, 226, 0.2)";
            customBtn.style.boxShadow = currentMode === 'custom' ? "0 0 20px rgba(138, 43, 226, 0.8)" : "0 0 10px rgba(138, 43, 226, 0.3)";

            if (currentMode === 'custom') {
                nftOverlay.style.opacity = 1;
            } else {
                nftOverlay.style.opacity = 0;
            }

            if (currentMode === 'cyber') {
                particleMat.color.setHex(0x00ffff);
                effectLight.color.setHex(0x00ffff);
            } else if (currentMode === 'kabuki') {
                particleMat.color.setHex(0xff0000); 
                effectLight.color.setHex(0xff0000); 
            } else if (currentMode === 'custom') {
                particleMat.color.setHex(0xff00ff);
                effectLight.color.setHex(0x8a2be2);
            }
        }

        normalBtn.addEventListener('click', () => { currentMode = 'none'; updateUI(); });
        cyberBtn.addEventListener('click', () => { currentMode = 'cyber'; updateUI(); });
        kabukiBtn.addEventListener('click', () => { currentMode = 'kabuki'; updateUI(); });
        customBtn.addEventListener('click', () => { currentMode = 'custom'; updateUI(); });

        // --- 8. アニメーションループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (!isDragging) {
                maskGroup.rotation.y += 0.005;
                maskGroup.rotation.x += (0 - maskGroup.rotation.x) * 0.05;
            }

            particleMesh.rotation.y = time * 0.1;

            if (currentMode === 'cyber') {
                if (cyberMat.opacity < 0.6) cyberMat.opacity += 0.02;
                if (kabukiMat.opacity > 0) kabukiMat.opacity -= 0.05;
                if (customMat.opacity > 0) customMat.opacity -= 0.05;
                
                if (effectLight.intensity < 2) effectLight.intensity += 0.1;
                if (particleMat.opacity < 0.8) particleMat.opacity += 0.02;
                
                cyberMat.opacity = 0.4 + Math.sin(time * 3) * 0.2;

            } else if (currentMode === 'kabuki') {
                if (kabukiMat.opacity < 0.8) kabukiMat.opacity += 0.02;
                if (cyberMat.opacity > 0) cyberMat.opacity -= 0.05;
                if (customMat.opacity > 0) customMat.opacity -= 0.05;
                
                if (effectLight.intensity < 2) effectLight.intensity += 0.1;
                if (particleMat.opacity < 0.8) particleMat.opacity += 0.02;
                
                kabukiMat.opacity = 0.6 + Math.sin(time * 1.5) * 0.2;

            } else if (currentMode === 'custom') {
                if (customMat.opacity < 0.8) customMat.opacity += 0.02;
                if (cyberMat.opacity > 0) cyberMat.opacity -= 0.05;
                if (kabukiMat.opacity > 0) kabukiMat.opacity -= 0.05;
                
                if (effectLight.intensity < 2) effectLight.intensity += 0.1;
                if (particleMat.opacity < 0.8) particleMat.opacity += 0.02;
                
                customMat.opacity = 0.5 + Math.sin(time * 2) * 0.3;

            } else {
                if (cyberMat.opacity > 0) cyberMat.opacity -= 0.05;
                if (kabukiMat.opacity > 0) kabukiMat.opacity -= 0.05;
                if (customMat.opacity > 0) customMat.opacity -= 0.05;
                if (effectLight.intensity > 0) effectLight.intensity -= 0.1;
                if (particleMat.opacity > 0) particleMat.opacity -= 0.05;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
